# Collector specific configuration
base_url: "https://www.hydrosheds.org/products/"

boundary_dataset: "unmap-international-boundaries-geojson"

boundary_resource: "polbnda_int_15m"

data_types:
  HydroBASINS:
    notes: "HydroBASINS represents a series of vectorized polygon layers that depict sub-basin boundaries at a global scale. The goal of this product is to provide a seamless global coverage of consistently sized and hierarchically nested sub-basins at different scales (from tens to millions of square kilometers), supported by a coding scheme that allows for analysis of catchment topology such as up- and downstream connectivity. HydroBASINS has been extracted from the gridded HydroSHEDS core layers at 15 arc-second resolution.  \n  \nAn important characteristic of any sub-basin delineation is the sub-basin breakdown, i.e. the decision of when and how to subdivide a larger basin into multiple tributary basins. At its highest level of sub-basin breakdown, HydroBASINS divides a basin into two sub-basins at every location where two river branches meet which each have an individual upstream area of at least 100 km². A second critical feature of sub-basin delineations is the way the sub-basins are grouped or coded to allow for the creation of nested sub-basins at different scales, or to navigate within the sub-basin network from up- to downstream. To support these functionalities and topological concepts, the ‘Pfafstetter’ coding system has been implemented in the HydroBASINS product offering 12 hierarchically nested sub-basin breakdowns globally.  \n  \nAt its highest level of sub-basin breakdown, HydroBASINS encompasses 1.0 million individual sub-basin polygons with an average area of 130.6 km², representing a total of 135.0 million km² of global land area (excluding Antarctica). HydroBASINS only includes a limited amount of (mostly geometric) attribute information, such as the sub-basin area, the distance from upstream headwaters and ocean outlet, and the Pfafstetter coding."
    subset_method: "clip"
    attribute: "HYBAS_ID"
    file_pattern: "hybas_(af|as|eu|na|sa)_lev.*\\.zip"
    year_start: 2013
    year_end: 2013
  HydroLAKES:
    notes: "HydroLAKES aims to provide the shoreline polygons of all global lakes with a surface area of at least 10 ha. HydroLAKES has been developed using a suite of auxiliary data sources of lake polygons and gridded lake surface areas. All lakes are co-registered to the global river network of the HydroSHEDS database via their lake pour points. The global coverage of HydroLAKES encompasses 1.4 million individual lakes or reservoirs representing a total surface area of 2.67 million km², a total shoreline length of 7.2 million km, and a total storage volume of 181,900 km³. HydroLAKES only includes a limited amount of (mostly geometric) attribute information, such as surface area, shoreline length, and estimates of average depth, water volume and residence time. Every lake is also co-registered to a river reach of the HydroRIVERS dataset and a sub-basin of the HydroBASINS database (via shared IDs)."
    subset_method: "subset"
    attribute: "Country"
    file_pattern: "hydrolakes_polys_.*_shp.zip"
    year_start: 2016
    year_end: 2016
  HydroRIVERS:
    notes: "HydroRIVERS represents a vectorized line network of all global rivers that have a catchment area of at least 10 km² or an average river flow of at least 0.1 m³/sec, or both. HydroRIVERS has been extracted from the gridded HydroSHEDS core layers at 15 arc-second resolution. The global coverage of HydroRIVERS encompasses 8.5 million individual river reaches with an average length of 4.2 km, representing a total of 35.9 million km of rivers globally. HydroRIVERS only includes a limited amount of (mostly geometric) attribute information, such as the river reach length, the distance from upstream headwaters and ocean outlet, the river order, and an estimate of long-term average discharge. Every river reach is also co-registered to the sub-basin of the HydroBASINS database in which it resides (via a shared ID)."
    subset_method: "clip"
    attribute: "HYRIV_ID"
    file_pattern: "hydrorivers_v[0-9]{2}_shp.zip"
    year_start: 2013
    year_end: 2013

tags:
  - hydrology

continents:
  af: Africa
  as: Asia
  eu: Europe
  na: Americas
  sa: Americas
